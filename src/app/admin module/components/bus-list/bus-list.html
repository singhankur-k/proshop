<div class="bus-list">
    <div class="toolbar">
      <input matInput placeholder="Search…" (keyup)="applyFilter($any($event.target).value)">
      <button mat-flat-button color="primary" routerLink="/admin/bus-management/new">
        <mat-icon>add</mat-icon> Add Bus
      </button>
    </div>
  
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
  
      <!-- Reg Number -->
      <ng-container matColumnDef="regNumber">
        <th mat-header-cell *matHeaderCellDef>Bus No</th>
        <td mat-cell *matCellDef="let b">{{ b.busNumber }}</td>
      </ng-container>
  
      <!-- Model -->
      <ng-container matColumnDef="model">
        <th mat-header-cell *matHeaderCellDef>Bus Name</th>
        <td mat-cell *matCellDef="let b">{{ b.busName }}</td>
      </ng-container>
  
      <!-- Type -->
      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef>Type</th>
        <td mat-cell *matCellDef="let b">{{ b.busType }}</td>
      </ng-container>
  
      <!-- Capacity -->
      <ng-container matColumnDef="capacity">
        <th mat-header-cell *matHeaderCellDef>Capacity</th>
        <td mat-cell *matCellDef="let b">{{ b.seatCapacity }}</td>
      </ng-container>
  
      <!-- Status -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let b">Active</td>
      </ng-container>
  
      <!-- Actions -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let b">
          <button mat-icon-button (click)="edit(b)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="delete(b.busId)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>
  
      <!-- Table Header and Rows -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  
    <mat-paginator [pageSize]="10"></mat-paginator>
  </div>
