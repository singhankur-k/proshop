<mat-card class="passenger-card mat-elevation-z4">
    <mat-card-header>
      <div mat-card-avatar class="avatar-icon"></div>
      <mat-card-title>Enter Passenger Details</mat-card-title>
      <mat-card-subtitle>Please fill in the required fields</mat-card-subtitle>
    </mat-card-header>
  
    <mat-card-content>
      <form [formGroup]="passengerForm" (ngSubmit)="onSubmit()">
  
        <mat-form-field appearance="outline" class="form-field">
          <mat-label>Passenger Name</mat-label>
          <input matInput formControlName="name" placeholder="John Doe" />
          <mat-error *ngIf="passengerForm.get('name')?.hasError('required')">
            Name is required
          </mat-error>
          <mat-error *ngIf="passengerForm.get('name')?.hasError('minlength')">
            Must be at least 2 characters
          </mat-error>
        </mat-form-field>
  
        <div>
            {{seatNumber}}
        </div>
  
        <div class="button-container">
          <button mat-raised-button color="primary" type="submit" [disabled]="passengerForm.invalid">
            Confirm
          </button>
        </div>
  
      </form>
    </mat-card-content>
  </mat-card>
