<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <form [formGroup]="pointForm" (ngSubmit)="onSave()">
    <mat-form-field  appearance="fill" style="width: 100%;">
      <mat-label>Enter point</mat-label>
      <input matInput formControlName="point" />
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" [disabled]="pointForm.invalid" (click)="onSave()">Save</button>
</mat-dialog-actions>
